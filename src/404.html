<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הדף לא נמצא | בדרך הנכונה</title>
<meta name="robots" content="noindex">
<style>
:root { --ground: #F7F9FB; --ink: #0C162B; --ink-2: #3D4D64; --sky: #38B3FF; }
@media (prefers-color-scheme: dark) { :root { --ground: #0B1424; --ink: #EAF1F8; --ink-2: #A9B8CB; color-scheme: dark; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ground); color: var(--ink); font-family: "Noto Sans Hebrew", "Arial Hebrew", "Segoe UI", system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
main { max-width: 36rem; display: grid; gap: 18px; }
h1 { margin: 0; font-size: clamp(2.25rem, 8vw, 4rem); line-height: 1; font-weight: 800; }
p { margin: 0; font-size: 1.125rem; line-height: 1.55; color: var(--ink-2); }
a { justify-self: start; background: var(--ink); color: var(--ground); padding: .9em 1.3em; font-weight: 700; text-decoration: none; border-start-start-radius: 1.1em; }
a:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>הדף הזה לא קיים.</h1>
  <p>אולי הקישור השתנה. כל המידע על השיעורים, תהליך ההצטרפות והמורים נמצא בדף הבית.</p>
  <a href="/">לדף הבית</a>
</main>
</body>
</html>
