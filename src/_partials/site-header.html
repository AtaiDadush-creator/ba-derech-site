<script>
// Phone menu, inline so it works even if main.js does not load. Without JavaScript the links simply stay visible (.js in styles.css).
(function () {
  var btn = document.querySelector(".menu-btn"), menu = document.getElementById("menu");
  if (!btn || !menu) return;
  var label = btn.textContent, close = btn.getAttribute("data-close");
  var set = function (open) {
    menu.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    btn.textContent = open ? close : label;
  };
  btn.hidden = false;
  btn.addEventListener("click", function () { set(!menu.classList.contains("open")); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && menu.classList.contains("open")) { set(false); btn.focus(); }
  });
  document.addEventListener("click", function (e) {
    if (menu.classList.contains("open") && !(e.target.closest && e.target.closest(".nav"))) set(false);
  });
})();
</script>
