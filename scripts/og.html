<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Noto Sans Hebrew"; font-weight: 400 800; font-stretch: 62.5% 100%; src: url("../src/assets/fonts/noto-sans-hebrew-hebrew.woff2") format("woff2"); unicode-range: U+0590-05FF, U+20AA, U+FB1D-FB4F; }
@font-face { font-family: "Noto Sans Hebrew"; font-weight: 400 800; font-stretch: 62.5% 100%; src: url("../src/assets/fonts/noto-sans-hebrew-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
html, body { margin: 0; }
body { width: 1200px; height: 630px; background: #0C162B; color: #F2F7FC; font-family: "Noto Sans Hebrew", sans-serif; position: relative; overflow: hidden; }
.stage { position: absolute; left: 0; bottom: 0; width: 470px; height: 470px; background: #38B3FF; border-top-right-radius: 470px; }
.stage img { position: absolute; left: 40px; bottom: 40px; width: 300px; }
.text { position: absolute; right: 80px; top: 92px; width: 640px; display: grid; gap: 26px; }
.logo { height: 64px; justify-self: start; }
h1 { margin: 0; font-size: 104px; font-weight: 800; font-stretch: 78%; line-height: .95; letter-spacing: -0.02em; }
p { margin: 0; font-size: 34px; line-height: 1.35; font-weight: 600; }
p span { color: #38B3FF; }
</style>
</head>
<body>
<div class="stage"><img src="../src/assets/img/emblem.png" alt=""></div>
<div class="text">
  <img class="logo" src="../src/assets/img/logo-wide-white.png" alt="">
  <h1>קבוצה קטנה,<br>מורה קבוע.</h1>
  <p>מתמטיקה בזום לכיתות ו׳ עד ט׳.<br><span>שיעור ניסיון ושיחת אפיון בחינם.</span></p>
</div>
</body>
</html>
